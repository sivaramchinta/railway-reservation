services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: railway
      POSTGRES_PASSWORD: railway
      POSTGRES_DB: railway
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U railway -d railway']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
